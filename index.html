<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Explore Polymarket trading activity." />
    <title>Polymarket Trading Trends</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <strong>EDA</strong>
      <a
        href="https://drive.google.com/file/d/1wEvzJe5wpAbR4YxQTr3ses-RUnC_lfgw/view?pli=1"
        target="_blank"
        rel="noopener noreferrer"
        >data.parquet</a
      >
    </header>
    <main>
      <h1>Polymarket Trading Trends</h1>
      <p>Trader activity overview · medians are approximate</p>

      <dl class="metrics" aria-label="Summary metrics">
        <div>
          <dt>Trader records</dt>
          <dd aria-label="Not available">—</dd>
        </div>
        <div>
          <dt>Unique traders</dt>
          <dd aria-label="Not available">—</dd>
        </div>
        <div>
          <dt>Median trader volume</dt>
          <dd aria-label="Not available">—</dd>
        </div>
        <div>
          <dt>Median transactions</dt>
          <dd aria-label="Not available">—</dd>
        </div>
      </dl>

      <section aria-labelledby="volume-title">
        <h2 id="volume-title">Trader labels</h2>
        <div id="chart" class="empty" aria-live="polite">
          <p>Data has not been loaded yet.</p>
        </div>
      </section>

      <section class="explorer" aria-labelledby="distribution-title">
        <h2 id="distribution-title">Distribution explorer</h2>
        <div class="explorer-controls">
          <label>
            Metric
            <select id="distribution-metric">
              <option value="trader_volume">Trader volume</option>
              <option value="trader_pnl">Trader P&amp;L</option>
              <option value="transaction_count">Transaction count</option>
            </select>
          </label>
          <label>
            View
            <select id="distribution-view">
              <option value="log">All values — signed log</option>
              <option value="central">Middle 98% — linear</option>
              <option value="linear">All values — linear</option>
            </select>
          </label>
        </div>
        <p id="distribution-status" role="status">Loading distributions…</p>
        <div id="distribution-chart"></div>
        <p id="distribution-axis"></p>
      </section>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
